<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d111c"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e0b0"/>
      <stop offset="0.45" stop-color="#d9b370"/>
      <stop offset="1" stop-color="#a8823f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#d9b370" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#d9b370" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="url(#plate)"/>
  <rect width="32" height="32" rx="7.5" fill="url(#halo)"/>
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="7"
        fill="none" stroke="#d9b370" stroke-opacity="0.4" stroke-width="1.1"/>

  <!-- stepped setback tower with spire -->
  <path fill="url(#gold)" d="M8 27 V22 H10 V18 H11.6 V14.5 H12.8 V11 H13.8 V8 H14.6 V6 H15.6
                             L16 2.1 L16.4 6 H17.4 V8 H18.2 V11 H19.2 V14.5 H20.4 V18
                             H22 V22 H24 V27 Z"/>

  <!-- mullion shadow, gives the facade depth -->
  <path fill="#05060a" fill-opacity="0.34" d="M15.4 27 V6.2 L16 3.4 V27 Z"/>

  <!-- horizon -->
  <rect x="5.5" y="26.6" width="21" height="0.9" fill="#d9b370" fill-opacity="0.55"/>
</svg>
