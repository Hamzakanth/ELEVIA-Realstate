<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f18"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9efd4"/>
      <stop offset="0.35" stop-color="#e8c98a"/>
      <stop offset="1" stop-color="#b8914f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.3" r="0.62">
      <stop offset="0" stop-color="#d9b370" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d9b370" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="plateClip"><rect width="32" height="32" rx="7.5"/></clipPath>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="url(#plate)"/>
  <rect width="32" height="32" rx="7.5" fill="url(#halo)"/>

  <g clip-path="url(#plateClip)" fill="url(#gold)">
    <!-- cluster of tapered spires, tallest needle just left of centre -->
    <path d="M8.4 28.5 V23.2 L9 21 L9.6 23.2 V28.5 Z"/>
    <path d="M10.2 28.5 V17 L10.9 13.5 L11.6 17 V28.5 Z"/>
    <path d="M12.4 28.5 V13.5 L13.35 9.5 L14.3 13.5 V28.5 Z"/>
    <path d="M15 28.5 V9.6 L15.575 2.6 L16.15 9.6 V28.5 Z"/>
    <path d="M17 28.5 V15 L17.85 11.5 L18.7 15 V28.5 Z"/>
    <path d="M19.3 28.5 V18 L20.05 15 L20.8 18 V28.5 Z"/>
    <path d="M21.3 28.5 V21 L21.95 18.5 L22.6 21 V28.5 Z"/>
    <!-- dune the spires rise out of -->
    <path d="M1 29.2 Q16 24.5 31 29.2 L31 32 L1 32 Z"/>
  </g>

  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="7"
        fill="none" stroke="#d9b370" stroke-opacity="0.38" stroke-width="1.1"/>
</svg>
